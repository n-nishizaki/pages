<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProductScan</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap');
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c28;--accent:#00e5ff;--accent2:#ff6b35;--text:#e8e8f0;--text-dim:#6b6b88;--border:rgba(0,229,255,0.15);--scan-line:rgba(0,229,255,0.6)}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans JP',sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
  .logo{font-family:'Space Mono',monospace;font-size:16px;color:var(--accent);letter-spacing:2px}
  .logo span{color:var(--accent2)}
  #status-badge{font-family:'Space Mono',monospace;font-size:10px;padding:4px 10px;border-radius:20px;border:1px solid var(--accent);color:var(--accent);letter-spacing:1px;transition:all .3s}
  #status-badge.scanning{background:rgba(0,229,255,.1);animation:pulse 1.5s infinite}
  #status-badge.analyzing{background:rgba(255,107,53,.1);border-color:var(--accent2);color:var(--accent2);animation:pulse2 1s infinite}
  #status-badge.detected{background:rgba(0,255,100,.1);border-color:#00ff64;color:#00ff64}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,229,255,.4)}50%{box-shadow:0 0 0 4px rgba(0,229,255,0)}}
  @keyframes pulse2{0%,100%{box-shadow:0 0 0 0 rgba(255,107,53,.4)}50%{box-shadow:0 0 0 4px rgba(255,107,53,0)}}
  #camera-section{position:relative;flex-shrink:0;height:42vh;background:#000;overflow:hidden}
  #video{width:100%;height:100%;object-fit:cover;display:block}
  .scan-overlay{position:absolute;inset:0;pointer-events:none}
  .corner{position:absolute;width:28px;height:28px;border-color:var(--accent);border-style:solid;opacity:.9}
  .corner.tl{top:14px;left:14px;border-width:2px 0 0 2px}
  .corner.tr{top:14px;right:14px;border-width:2px 2px 0 0}
  .corner.bl{bottom:14px;left:14px;border-width:0 0 2px 2px}
  .corner.br{bottom:14px;right:14px;border-width:0 2px 2px 0}
  .scan-line{position:absolute;left:14px;right:14px;height:1px;background:linear-gradient(90deg,transparent,var(--scan-line),transparent);animation:scan 2.5s ease-in-out infinite;box-shadow:0 0 8px var(--scan-line)}
  @keyframes scan{0%{top:18%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:82%;opacity:0}}
  #bar-wrap{position:absolute;bottom:38px;left:14px;right:14px;height:2px;background:rgba(255,255,255,.08);border-radius:1px}
  #bar{height:100%;width:0%;background:var(--accent);border-radius:1px}
  #det-overlay{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.88));padding:20px 14px 10px;min-height:44px}
  #det-text{font-family:'Space Mono',monospace;font-size:11px;color:var(--accent2);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #det-text.empty{color:var(--text-dim)}
  #start-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.78);gap:14px;padding:0 24px}
  #start-btn{background:var(--accent);color:#000;border:none;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;letter-spacing:2px;padding:13px 30px;cursor:pointer;border-radius:2px}
  #start-hint{font-size:10px;color:var(--text-dim);font-family:'Space Mono',monospace;text-align:center;line-height:1.8}
  #key-wrap{display:flex;gap:6px;align-items:center;width:100%}
  #key-input{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);font-family:'Space Mono',monospace;font-size:11px;padding:9px 10px;border-radius:2px;flex:1;letter-spacing:1px}
  #key-input::placeholder{color:var(--text-dim)}
  #key-input:focus{outline:none;border-color:var(--accent)}
  #key-save{background:transparent;border:1px solid var(--accent);color:var(--accent);font-family:'Space Mono',monospace;font-size:10px;padding:9px 12px;cursor:pointer;border-radius:2px;white-space:nowrap}
  canvas{display:none}
  .divider{display:flex;align-items:center;gap:10px;padding:9px 16px;flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
  .div-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;color:var(--text-dim);white-space:nowrap}
  .div-line{flex:1;height:1px;background:var(--border)}
  #res-count{font-family:'Space Mono',monospace;font-size:10px;color:var(--accent)}
  #results{flex:1;overflow-y:auto;padding:12px;background:var(--bg)}
  #results::-webkit-scrollbar{width:3px}
  #results::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  #grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:4px;overflow:hidden;animation:card-in .3s ease both;position:relative}
  @keyframes card-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .card-seq{position:absolute;top:6px;left:6px;font-family:'Space Mono',monospace;font-size:9px;color:var(--accent);background:rgba(0,229,255,.12);padding:2px 5px;border-radius:2px;letter-spacing:1px;z-index:1}
  .card-body{padding:8px 8px 10px}
  .card-maker{font-family:'Space Mono',monospace;font-size:9px;color:var(--accent2);letter-spacing:.5px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:16px}
  .card-title{font-size:12px;font-weight:700;line-height:1.4;margin-bottom:5px;color:var(--text)}
  .card-desc{font-size:10px;color:var(--text-dim);line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .card-price{margin-top:6px;font-family:'Space Mono',monospace;font-size:11px;color:var(--accent)}
  .card-tag{display:inline-block;margin-top:5px;font-size:9px;font-family:'Space Mono',monospace;color:var(--text-dim);background:var(--surface2);padding:2px 6px;border-radius:2px}
  #empty{grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--text-dim)}
  #empty .ei{font-size:36px;margin-bottom:12px;opacity:.35}
  #empty p{font-size:11px;font-family:'Space Mono',monospace;letter-spacing:1px;line-height:1.9}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">PRODUCT<span>SCAN</span></div>
    <div id="status-badge">STANDBY</div>
  </header>
  <div id="camera-section">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
    <div class="scan-overlay">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="scan-line"></div>
    </div>
    <div id="bar-wrap"><div id="bar"></div></div>
    <div id="det-overlay"><div id="det-text" class="empty">— 商品にカメラを向けてください —</div></div>
    <div id="start-overlay">
      <div id="key-wrap">
        <input id="key-input" type="password" placeholder="sk-ant-... APIキー" autocomplete="off">
        <button id="key-save">SET</button>
      </div>
      <button id="start-btn">&#9654; SCAN START</button>
      <div id="start-hint">カメラ映像をClaudeのVision APIで解析します<br>APIキーはこのデバイス内にのみ保存されます</div>
    </div>
  </div>
  <div class="divider">
    <div class="div-label">RESULTS</div>
    <div class="div-line"></div>
    <div id="res-count">0 items</div>
  </div>
  <div id="results">
    <div id="grid">
      <div id="empty"><div class="ei">&#128230;</div><p>スキャン開始後<br>自動で商品を検出します</p></div>
    </div>
  </div>
</div>
<script>
const INTERVAL=5000,DEDUP=20000;
const st={apiKey:localStorage.getItem('ps_key')||'',scanning:false,analyzing:false,seq:0,recent:new Set()};
const $=id=>document.getElementById(id);
const video=$('video'),canvas=$('canvas'),ctx=canvas.getContext('2d');
const badge=$('status-badge'),detText=$('det-text'),grid=$('grid'),cnt=$('res-count'),bar=$('bar');

if(st.apiKey) $(‘key-input’).placeholder=‘sk-ant-***（保存済み）’;

$(‘key-save’).addEventListener(‘click’,()=>{
const v=$(‘key-input’).value.trim();
if(v){st.apiKey=v;localStorage.setItem(‘ps_key’,v);$(‘key-input’).value=’’;$(‘key-input’).placeholder=‘sk-ant-***（保存済み）’;$(‘key-save’).textContent=‘✓’;setTimeout(()=>$(‘key-save’).textContent=‘SET’,1500);}
});

$(‘start-btn’).addEventListener(‘click’,async()=>{
if(!st.apiKey){$(‘key-input’).style.borderColor=‘var(–accent2)’;$(‘key-input’).placeholder=‘APIキーを先に入力してください’;return;}
try{
const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:‘environment’},width:{ideal:1280}}});
video.srcObject=stream;await video.play();
$(‘start-overlay’).style.display=‘none’;
st.scanning=true;setStatus(‘SCANNING’,‘scanning’);startLoop();
}catch(e){$(‘start-hint’).textContent=‘カメラアクセスが拒否されました’;}
});

function startLoop(){animBar();setTimeout(async function tick(){
if(!st.scanning)return;
if(!st.analyzing){
st.analyzing=true;setStatus(‘ANALYZING’,‘analyzing’);
try{await analyze();}catch(e){console.warn(e);}
st.analyzing=false;if(st.scanning)setStatus(‘SCANNING’,‘scanning’);
}
animBar();setTimeout(tick,INTERVAL);
},INTERVAL);}

function animBar(){
bar.style.transition=‘none’;bar.style.width=‘0%’;
requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition=`width ${INTERVAL}ms linear`;bar.style.width=‘100%’;}));
}

async function analyze(){
canvas.width=video.videoWidth||640;canvas.height=video.videoHeight||480;
ctx.drawImage(video,0,0,canvas.width,canvas.height);
const maxW=800;let w=canvas.width,h=canvas.height;
if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
const off=document.createElement(‘canvas’);off.width=w;off.height=h;
off.getContext(‘2d’).drawImage(canvas,0,0,w,h);
const b64=off.toDataURL(‘image/jpeg’,.75).split(’,’)[1];

const res=await fetch(‘https://api.anthropic.com/v1/messages’,{
method:‘POST’,
headers:{‘Content-Type’:‘application/json’,‘x-api-key’:st.apiKey,‘anthropic-version’:‘2023-06-01’},
body:JSON.stringify({
model:‘claude-sonnet-4-20250514’,max_tokens:1000,
system:`あなたは商品認識AIです。カメラ映像フレームから商品・製品を特定します。JSONのみ返してください。マークダウン不要。 商品特定できた場合: {"found":true,"productName":"正式な商品名","manufacturer":"メーカー名","category":"カテゴリ","description":"説明30〜50字","priceRange":"価格帯（不明なら空文字）"} 特定できない場合: {"found":false}`,
messages:[{role:‘user’,content:[
{type:‘image’,source:{type:‘base64’,media_type:‘image/jpeg’,data:b64}},
{type:‘text’,text:‘この画像に映っている商品・製品を特定してください。’}
]}]
})
});
if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${res.status}`);}
const data=await res.json();
const text=(data.content||[]).filter(b=>b.type===‘text’).map(b=>b.text).join(’’);
let info=null;try{info=JSON.parse(text.replace(/`json|`/g,’’).trim());}catch{return;}
if(!info?.found)return;
const key=info.productName;
if(st.recent.has(key))return;
st.recent.add(key);setTimeout(()=>st.recent.delete(key),DEDUP);
detText.textContent=`\u25B6 ${info.productName}`;detText.classList.remove(‘empty’);
setStatus(‘DETECTED’,‘detected’);setTimeout(()=>{if(st.scanning)setStatus(‘SCANNING’,‘scanning’);},2000);
addCard(info);
}

function addCard(info){
const e=document.getElementById(‘empty’);if(e)e.remove();
const seq=++st.seq;const card=document.createElement(‘div’);card.className=‘card’;
card.innerHTML=`<div class="card-seq">#${String(seq).padStart(2,'0')}</div><div class="card-body"><div class="card-maker">${esc(info.manufacturer||'')}</div><div class="card-title">${esc(info.productName)}</div><div class="card-desc">${esc(info.description||'')}</div>${info.priceRange?`<div class="card-price">${esc(info.priceRange)}</div>`:''}${info.category?`<div class="card-tag">${esc(info.category)}</div>`:''}</div>`;
grid.insertBefore(card,grid.firstChild);
const n=grid.querySelectorAll(’.card’).length;cnt.textContent=`${n} item${n!==1?'s':''}`;
}
function setStatus(l,c){badge.textContent=l;badge.className=c||’’;}
function esc(s){return String(s||’’).replace(/&/g,’&’).replace(/</g,’<’).replace(/>/g,’>’);}
</script>

</body>
</html>
